name: Data Sync

on:
  schedule:
    - cron: '0 4 * * *'   # 每天 04:00 UTC 主动拉取上游最新
  workflow_dispatch:        # 允许 GitHub UI 手动触发

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 上游数据（2026-08-12 起非 git 子模块）：浅克隆保留 .git，
      # version 模块依赖 HEAD 提交标题（OSPRODWin 版本号）；每次全新环境直接 clone，
      # 上游无新提交时转换产物无 diff，由提交步骤的 diff 判断兜底退出
      - name: Fetch upstream data (shallow clone)
        run: git clone --depth 1 https://github.com/DimbreathBot/TurnBasedGameData.git vendor/TurnBasedGameData

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/converter/requirements.txt

      - name: Install converter dependencies
        run: pip install -r tools/converter/requirements.txt

      # 无 converter 单测步骤（2026-08-14）：converter 代码未变时每天重复跑同一测试；
      # 回归由本步骤 Run converter 兜底——转换失败即 job 失败、commit 步骤 diff 判空退出不推送坏数据
      - name: Run converter
        run: |
          cd tools/converter
          python convert.py --force

      - name: Generate DATA_CATALOG.md
        run: |
          cd tools/converter
          python gen_catalog.py
        # 全量模式产出总索引 + DATA_CATALOG.parts/ 分片（按文件名首字母），两者都要入库；
        # --top / --filter 局部索引是本地临时产物，被 .gitignore 排除，不会误提交

      # 软门禁（2026-08-12 迭代）：main 无 required checks，直接 push 即达；
      # push 触发 CI（unit-tests + e2e）与 Vercel 构建守卫，失败可回滚。
      # 死链审计（tools/dead-links.test.ts）已从 CI 移除（2026-08-14）：CI 数据中心 IP
      # 对 jsDelivr 403 → 全部判 env → 真死链发现不了且 env 缓存 1 天导致每天重测空转；
      # 死链是静态事实，本机（真实网络）按需跑即可（数据变更后 / 发现破图时）。
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 语言包必须与结构层同批提交：结构层里的文本是引用令牌，缺包会让前端解析报缺键；
          # `pnpm build` 前置的 check-i18n-packs.mjs 会把这种提交拦在部署之前（见 ADR 0052）。
          git add public/data/cn/ public/data/i18n/ tools/converter/DATA_CATALOG.md tools/converter/DATA_CATALOG.parts/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync data from upstream update"
          git push origin HEAD:main || {
            echo "Non-fast-forward, rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }