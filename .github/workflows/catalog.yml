name: Data Sync

on:
  push:
    branches: [main]
    paths:
      - 'vendor/TurnBasedGameData'

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install converter dependencies
        run: pip install -r tools/converter/requirements.txt

      - name: Run converter
        run: |
          cd tools/converter
          python convert.py --force

      - name: Generate DATA_CATALOG.md
        run: |
          cd tools/converter
          python gen_catalog.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cn/ tools/converter/DATA_CATALOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync data from submodule update [skip ci]"
            git push
          fi
