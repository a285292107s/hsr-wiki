name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支连续 push 串行化，新 run 取消旧 run（省重复 CI 分钟数）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 仅跑单测 + e2e（2026-08-14 精简）：
# - 无 pnpm build：vercel.json buildCommand 同为 pnpm build（含 vue-tsc + 三守卫），Vercel 生产/预览构建即发布门，
#   失败不部署可回滚；CI 重复跑同命令零增量。push 后类型/构建反馈由 Vercel 承担。
# - 无 converter 测试：converter 代码变更低频，每次 push 重复跑纯浪费；回归由 data-sync 的 Run converter
#   兜底（转换失败即失败、diff 判空不推送坏数据）+ 本机 pytest（converter 变更时按 AGENTS.md 流程）。
# - e2e 分层（2026-08-15 决策）：CI 仅跑 layout + a11y（test:e2e:ci，零外部依赖、环境无关）；
#   visual 像素基线回本机（判定依赖环境——CI IP 对 jsDelivr burst 限流 + Linux/Windows 渲染差异，
#   本地跑同样能拦住基线过期，见 docs/memory/2026-08-15）。禁止把 visual.spec 加回 CI e2e job。
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright 浏览器二进制缓存（版本由 lockfile 锁定；命中后 install 秒级跳过）
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests（T1b/T2 布局 + a11y，环境无关守卫；visual 像素基线已回本机，勿加回）
        run: pnpm test:e2e:ci

      # e2e 失败时上传 HTML report + trace/截图（outputDir 在系统临时目录），供 PR 调试取证
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            /tmp/hsr-wiki-e2e-results/
          retention-days: 7
