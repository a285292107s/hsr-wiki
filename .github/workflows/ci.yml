name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & build
        run: pnpm build

      - name: Spine manifest validation
        run: node tools/check-spine-manifest.mjs

      - name: Color token check (ADR 0012)
        run: node tools/check-colors.mjs --strict

      - name: Unit tests
        run: pnpm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/converter/requirements.txt

      - name: Install converter dependencies
        run: pip install -r tools/converter/requirements.txt

      - name: Converter unit tests
        run: |
          cd tools/converter
          python -m pytest tests/ -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (T1b/T2 布局 + L4 像素基线 + a11y，发布门禁)
        run: pnpm test:e2e
