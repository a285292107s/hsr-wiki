name: Data Sync

on:
  push:
    branches: [main]
    paths:
      - 'vendor/TurnBasedGameData'
  schedule:
    - cron: '0 4 * * *'   # 每天 04:00 UTC 主动拉取子模块最新
  workflow_dispatch:        # 允许 GitHub UI 手动触发

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule to latest (schedule/dispatch only)
        if: github.event_name != 'push'
        run: |
          git submodule update --remote --merge vendor/TurnBasedGameData
          # 子模块无新提交时直接退出，避免空跑转换与提交
          if git diff --quiet vendor/TurnBasedGameData; then
            echo "Submodule unchanged, nothing to sync."
            exit 0
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/converter/requirements.txt

      - name: Install converter dependencies
        run: pip install -r tools/converter/requirements.txt

      - name: Run converter tests
        run: |
          cd tools/converter
          python -m pytest tests/ -q

      - name: Run converter
        run: |
          cd tools/converter
          python convert.py --force

      - name: Generate DATA_CATALOG.md
        run: |
          cd tools/converter
          python gen_catalog.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 死链审计（数据驱动，复用前端真实 URL 构造函数）：明确 404 才失败，
      # 网络错误 / 429 / 403 等环境性信号仅警告（CI 数据中心 IP 对 CDN 探测不可靠的历史教训）。
      # 缓存跨 job 持久化（run_id key + restore 最近）：converter 输出确定性 → 内容未变零网络复用。
      - name: Cache dead-links audit cache
        uses: actions/cache@v4
        with:
          path: temp/dead-links-cache.json
          key: dead-links-cache-${{ github.run_id }}
          restore-keys: dead-links-cache-

      - name: Dead link audit
        run: pnpm vitest run --config tools/dead-links.vitest.config.ts

      # 软门禁（2026-08-12 迭代）：main 无 required checks，直接 push 即达；
      # push 触发 CI 全量（build-and-test + e2e）与 Vercel 构建守卫，失败可回滚。
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/TurnBasedGameData public/data/cn/ tools/converter/DATA_CATALOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync data from submodule update"
          git push origin HEAD:main || {
            echo "Non-fast-forward, rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
