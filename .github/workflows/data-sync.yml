name: Data Sync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 上游非 git 子模块：--depth 1 但保留 .git（version 模块读 HEAD 提交标题）；上游无新提交时产物无 diff，
      # 由提交步骤 diff 判空退出。
      - name: Fetch upstream data (shallow clone)
        run: git clone --depth 1 https://github.com/DimbreathBot/TurnBasedGameData.git vendor/TurnBasedGameData

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/converter/requirements.txt

      - name: Install converter dependencies
        run: pip install -r tools/converter/requirements.txt

      # 不跑 converter 单测：代码未变时每天重复同一测试；回归由本步骤兜底——转换失败即 job 失败，diff 判空则不推坏数据。
      - name: Run converter
        run: |
          cd tools/converter
          python convert.py --force

      - name: Generate DATA_CATALOG.md
        run: |
          cd tools/converter
          python gen_catalog.py
        # 全量模式产出总索引 + 分片，两者都要入库；--top / --filter 局部索引被 .gitignore 排除（本地临时产物）。

      # 软门禁：main 无 required checks，直接 push 即达；push 会触发 CI 与 Vercel 构建守卫，失败可回滚。
      # 死链审计已移出 CI：CI 数据中心 IP 对 jsDelivr 403 ⇒ 全判 env、真死链查不出，env 缓存还会让每日重测空转；
      # 死链是静态事实，本机（真实网络）按需跑即可。
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 语言包必须与结构层同批提交：结构层里的文本是引用令牌，缺包会让前端解析报缺键；
          # `pnpm build` 前置的 check-i18n-packs.mjs 会把这种提交拦在部署之前（见 ADR 0052）。
          git add public/data/cn/ public/data/i18n/ tools/converter/DATA_CATALOG.md tools/converter/DATA_CATALOG.parts/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: sync data from upstream update"
          git push origin HEAD:main || {
            echo "Non-fast-forward, rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }