name: CI Full（全语言矩阵，周跑）

# 把 push 档已登记的覆盖收窄补回来（低频全量 ⇒ 收窄不等于长期失覆盖）：13 语言冒烟 + 全语言三档长文案。
# 收窄口径与周跑理由见 ci.yml 与 docs/agents/testing.md。
on:
  schedule:
    - cron: '30 20 * * 0'
  workflow_dispatch:

concurrency:
  group: ci-full
  cancel-in-progress: false

jobs:
  full-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 分片分母必须与矩阵长度一致（写成 /4 会让 3/4、4/4 永远不执行）；条数用 --list 数，不要写死。
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          browsers: chromium

      - name: 全语言矩阵（冒烟 + 三档长文案全语言）
        run: |
          pnpm exec playwright test \
            e2e/layout-locales-smoke.spec.ts \
            e2e/layout-i18n-overflow.spec.ts \
            e2e/layout-i18n-overflow-alt.spec.ts \
            e2e/layout-i18n-overflow-mobile.spec.ts \
            e2e/layout-i18n-overflow-narrow.spec.ts \
            --shard=${{ matrix.shard }}/2
        env:
          SMOKE_SCOPE: all
          I18N_OVERFLOW_ALL: '1'

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-artifacts-full-${{ matrix.shard }}
          path: |
            playwright-report/
            /tmp/hsr-wiki-e2e-results/
          retention-days: 14
