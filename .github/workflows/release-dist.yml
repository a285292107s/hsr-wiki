name: Release deployable dist

# 触发方式二选一：打 tag（如 v1.2.0）或手动。不改 main、不动 Vercel——
# 本工作流只负责把整站构建产物打成 Release 附件，供下载后丢到任意静态托管。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          browsers: ''

      # 与 vercel.json 的 buildCommand 同一条链：守卫链 + vue-tsc + vite build + 预渲染快照与 AI 端点断言。
      # 产物在 dist/（含 data/assets/icons 图标，约 250 MB，见 ADR 0069）。
      - name: 构建整站（守卫 + 类型 + 预渲染 + AI 端点断言）
        run: pnpm build

      # SPA 的 prerender 快照 + 路由重写靠 vercel.json；若把产物丢到别的静态托管，
      # 需要它自己实现同等 rewrite（快照投递 + catch-all → _shell.html），否则浅层路由可访问、深层刷新 404。
      - name: 打包 dist.tar.gz（含 vercel.json 供参照部署语义）
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "构建产物缺失 dist/index.html"; exit 1; }
          cp vercel.json dist/vercel.json
          tar -C dist -czf dist.tar.gz .
          ls -lh dist.tar.gz
          sha256sum dist.tar.gz | tee dist.tar.gz.sha256

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist.tar.gz
            dist.tar.gz.sha256
          fail_on_unmatched_files: true
          # 手动触发（非 tag）时没有 tag 名，指定一个固定 tag 兜底；已存在则更新资产、不重复建 Release。
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'dist-latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'dist-latest' }}
          body: |
            整站构建产物（Vite build + 1137 页预渲染快照）。

            用法：下载 `dist.tar.gz` 解压，把目录内容作为任意静态托管的根目录；
            校验：`sha256sum -c dist.tar.gz.sha256`。

            ⚠️ 该产物含 SPA 路由重写需求——`dist/vercel.json` 里的 rewrites 不可省，
            非 Vercel 托管需自行实现「预渲染快照投递 + catch-all → prerender/_shell.html」，
            否则 `/character/1212` 这类深层路由直接刷新会 404。
